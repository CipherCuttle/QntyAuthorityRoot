name: Ink V0F short-lived grant verifier

on:
  push:
    branches:
      - agent/ink-v0f-short-lived-grant-v0

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout authority root
        uses: actions/checkout@v4
        with:
          path: QntyAuthorityRoot
          fetch-depth: 0

      - name: Checkout exact QntySpot runtime
        uses: actions/checkout@v4
        with:
          repository: CipherCuttle/QntySpot
          ref: 428f373e61f76966cbbf1ebe1d565f50faa27e5c
          path: QntySpot
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        working-directory: QntyAuthorityRoot
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install -e ../QntySpot

      - name: Compile
        working-directory: QntyAuthorityRoot
        run: python -m compileall -q src tests qualifications

      - name: Whitespace
        working-directory: QntyAuthorityRoot
        run: git diff --check origin/main...HEAD

      - name: Portable authority-root regression
        working-directory: QntyAuthorityRoot
        env:
          PYTHONPATH: ../QntySpot
        run: |
          python -m pytest -q \
            tests/test_compatibility.py \
            tests/test_ledger.py \
            tests/test_policy_boundaries.py \
            tests/test_security_surfaces.py \
            tests/test_ink_v0f_dust_risk_policy.py \
            tests/test_ink_v0f_taker_binding.py \
            tests/test_ink_v0f_grant.py

      - name: Zero-money cross-repo grant qualification
        working-directory: QntyAuthorityRoot
        env:
          PYTHONPATH: ../QntySpot
        run: python -m pytest -q qualifications/test_ink_v0f_zero_money_grant.py
