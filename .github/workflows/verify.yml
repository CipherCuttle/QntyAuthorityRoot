name: qnty-authority-root-verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out AuthorityRoot
        uses: actions/checkout@v4
        with:
          path: QntyAuthorityRoot
      - name: Check out QntySpot history required by legacy governance tests
        uses: actions/checkout@v4
        with:
          repository: CipherCuttle/QntySpot
          ref: b25fa90a7fc0aa3304f17907b354cbab40c11ce3
          fetch-depth: 0
          path: QntySpot
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact checkouts
        run: |
          python -m pip install --disable-pip-version-check -e "./QntyAuthorityRoot[dev]"
          python -m pip install --disable-pip-version-check -e "./QntySpot"
      - name: Run portable AuthorityRoot test suite
        working-directory: QntyAuthorityRoot
        run: |
          python -m pytest -q \
            tests/test_compatibility.py \
            tests/test_ink_v0f_dust_risk_policy.py \
            tests/test_ink_v0f_grant.py \
            tests/test_ink_v0f_epoch5_production_issuance.py \
            tests/test_ink_v0f_epoch6_successor_grants.py \
            tests/test_ink_v0f_production_state_inspector.py \
            tests/test_ink_v0f_taker_binding.py \
            tests/test_ledger.py \
            tests/test_policy_boundaries.py \
            tests/test_security_surfaces.py

  ink-v0f-cross-repo-qualification:
    runs-on: ubuntu-latest
    steps:
      - name: Check out AuthorityRoot
        uses: actions/checkout@v4
        with:
          path: authority-root
      - name: Check out canonical QntySpot
        uses: actions/checkout@v4
        with:
          repository: CipherCuttle/QntySpot
          ref: b25fa90a7fc0aa3304f17907b354cbab40c11ce3
          path: qntyspot
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact checkouts
        run: |
          python -m pip install --disable-pip-version-check -e "./authority-root[dev]"
          python -m pip install --disable-pip-version-check -e "./qntyspot"
      - name: Recompute canonical QntySpot identity
        run: |
          python qntyspot/scripts/derive_deployment_identity.py \
            --root qntyspot \
            --repository-commit b25fa90a7fc0aa3304f17907b354cbab40c11ce3 \
            --output /tmp/qntyspot-identity.json
          python - <<'PY'
          import json
          from pathlib import Path
          artifact = json.loads(Path("/tmp/qntyspot-identity.json").read_text())
          expected = "3412d290f5ff0a3b1ae1915f071a503fccd9c5e386e7d4ef0335c9079c4c0e21"
          assert artifact["implementation_digest"] == expected, artifact["implementation_digest"]
          PY
      - name: Run zero-money cross-repo qualifications
        working-directory: authority-root
        run: |
          python -m pytest -q \
            qualifications/test_ink_v0f_zero_money_grant.py \
            qualifications/test_ink_v0f_level3_runtime_rehearsal.py
