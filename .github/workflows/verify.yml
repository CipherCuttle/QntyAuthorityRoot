name: qnty-authority-root-verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - run: python -m pytest -q tests

  ink-v0f-cross-repo-qualification:
    runs-on: ubuntu-latest
    steps:
      - name: Check out AuthorityRoot
        uses: actions/checkout@v4
        with:
          path: authority-root
      - name: Check out canonical QntySpot
        uses: actions/checkout@v4
        with:
          repository: CipherCuttle/QntySpot
          ref: 79d66648b80173f71c2e5a3b307984d525edf479
          path: qntyspot
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact checkouts
        run: |
          python -m pip install --disable-pip-version-check -e "./authority-root[dev]"
          python -m pip install --disable-pip-version-check -e "./qntyspot"
      - name: Recompute canonical QntySpot identity
        run: |
          python qntyspot/scripts/derive_deployment_identity.py \
            --root qntyspot \
            --repository-commit 79d66648b80173f71c2e5a3b307984d525edf479 \
            --output /tmp/qntyspot-identity.json
          python - <<'PY'
          import json
          from pathlib import Path
          artifact = json.loads(Path("/tmp/qntyspot-identity.json").read_text())
          expected = "ac408e3c0ccfdac8106b3c5aef44904e07504112aacc49a2097affdd3e025aea"
          assert artifact["implementation_digest"] == expected, artifact["implementation_digest"]
          PY
      - name: Run zero-money cross-repo qualification
        working-directory: authority-root
        run: python -m pytest -q qualifications/test_ink_v0f_zero_money_grant.py
